services:
  - type: web
    name: campus-chaos-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: EMAIL_FROM
        value: noreply@campuschaos.edu
      - key: BREVO_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_PORT
        value: 587
      - key: BREVO_USER
        sync: false
      - key: BREVO_PASS
        sync: false
